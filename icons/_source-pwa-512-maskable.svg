<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     fill="none">
  <title>PWA Maskable Icon 512 · fuente de exportación</title>
  <desc>SVG fuente para verbum-manet-512-maskable.png. Fondo navy sólido a sangre completa y marca dorada contenida dentro del safe area central del 50 por ciento para tolerar los recortes de máscara de Android (circular, squircle, teardrop). La marca nunca se acerca a los bordes del canvas.</desc>

  <!-- Fondo navy full-bleed · crítico para maskable, sin bordes transparentes -->
  <rect width="512" height="512" fill="#0d1420"/>

  <!-- Safe area (invisible, solo para referencia):
       Android garantiza que el 80% central del canvas es visible tras el recorte.
       Para seguridad con recortes agresivos (circular), usamos 50% del canvas.
       Mark 260×260 centrado · scale 2.6, translate (126,126) -->
  <g transform="translate(126,126) scale(2.6)">
    <rect x="6" y="6" width="88" height="88" rx="2.5" ry="2.5"
          stroke="#c9a84c" stroke-width="1" opacity="0.32"/>
    <path d="M 16 21 L 84 21" stroke="#c9a84c" stroke-width="0.7" opacity="0.5"/>
    <path d="M 16 79 L 84 79" stroke="#c9a84c" stroke-width="0.7" opacity="0.5"/>
    <path d="M 20 29 L 34 71 L 46 29"
          stroke="#c9a84c" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="1.7" fill="#c9a84c"/>
    <path d="M 54 71 L 54 29 L 66 55 L 78 29 L 78 71"
          stroke="#c9a84c" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
