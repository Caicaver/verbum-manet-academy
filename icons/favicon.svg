<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     fill="none"
     role="img"
     aria-label="Verbum Manet">
  <title>Verbum Manet</title>

  <!-- Favicon optimizado para renders 16×16 y 32×32.
       Sin marco exterior (se pierde a tamaños pequeños).
       Stroke más grueso proporcionalmente para asegurar legibilidad.
       Adaptación automática al tema del sistema: navy en claro, dorado en oscuro. -->
  <style>
    .vma-stroke { stroke: #0d1420; }
    .vma-fill   { fill:   #0d1420; }
    @media (prefers-color-scheme: dark) {
      .vma-stroke { stroke: #c9a84c; }
      .vma-fill   { fill:   #c9a84c; }
    }
  </style>

  <!-- Letra V -->
  <path d="M 4 7 L 8 25 L 12 7"
        class="vma-stroke"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Interpunct -->
  <circle cx="16" cy="16" r="1.3" class="vma-fill"/>

  <!-- Letra M -->
  <path d="M 20 25 L 20 7 L 24 17 L 28 7 L 28 25"
        class="vma-stroke"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
