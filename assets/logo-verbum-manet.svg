<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 100 100"
     fill="none"
     role="img"
     aria-label="Verbum Manet Academy — La Palabra permanece">
  <title>Verbum Manet Academy</title>
  <desc>Logotipo monocromático de Verbum Manet Academy. Monograma V·M compuesto por capitales romanas flanqueando un interpunct clásico, enmarcado en una placa inscripcional con dos filetes horizontales que evocan las inscripciones lapidarias romanas. Adaptación automática de color mediante currentColor.</desc>

  <!-- Marco exterior · placa inscripcional con esquinas ligeramente redondeadas -->
  <rect x="6" y="6"
        width="88" height="88"
        rx="2.5" ry="2.5"
        stroke="currentColor"
        stroke-width="1"
        opacity="0.32"/>

  <!-- Filetes horizontales · bandas que encierran el campo inscripcional,
       al modo de las placas epigráficas romanas (tabulae ansatae) -->
  <path d="M 16 21 L 84 21"
        stroke="currentColor"
        stroke-width="0.7"
        opacity="0.5"/>
  <path d="M 16 79 L 84 79"
        stroke="currentColor"
        stroke-width="0.7"
        opacity="0.5"/>

  <!-- Letra V · capital romana cuadrada con ápice bajo -->
  <path d="M 20 29 L 34 71 L 46 29"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Interpunct · punto medio epigráfico clásico (·) -->
  <circle cx="50" cy="50" r="1.7" fill="currentColor"/>

  <!-- Letra M · capital romana con valle interior moderado -->
  <path d="M 54 71 L 54 29 L 66 55 L 78 29 L 78 71"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
