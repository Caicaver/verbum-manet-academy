# ============================================================================
# Verbum Manet Academy · Integración Continua
# ----------------------------------------------------------------------------
# Valida la integridad estructural del corpus en cada push y pull request
# contra main. Si validar-corpus.js halla algún CRÍTICO (exit 1) o un error
# de invocación (exit 2), la build falla y el merge queda bloqueado.
#
# Ubicación esperada en el repo: .github/workflows/ci.yml
# Validador esperado:            tools/validar-corpus.js
# ============================================================================

name: Validación del corpus

# Cuándo se ejecuta -----------------------------------------------------------
# Nota: "on" va entrecomillado a propósito. Sin comillas, algunos parsers YAML
# lo interpretan como el booleano true (el "Norway problem"); las comillas
# garantizan que se lea como la clave de disparadores en cualquier herramienta.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:

# Evita ejecuciones redundantes: si llegan varios push seguidos a la misma
# rama, cancela las builds en curso y conserva solo la última.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos (principio de menor privilegio).
permissions:
  contents: read

jobs:
  validar-corpus:
    name: Validar corpus (20 cursos)
    runs-on: ubuntu-latest

    steps:
      # 1) Traer el repositorio al runner.
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2) Node 20 LTS. El validador requiere Node >= 18; 20 es el LTS vigente.
      #    Sin 'cache' porque el proyecto no tiene package-lock.json (sin deps).
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3) Comprobación de cordura: los validadores deben existir donde se espera.
      #    Falla con un mensaje claro si alguien los mueve de sitio.
      - name: Verificar que los validadores existen
        run: |
          for f in tools/validar-corpus.js tools/verify-invariants.js; do
            if [ ! -f "$f" ]; then
              echo "::error::No se encontró $f"
              exit 1
            fi
          done

      # 4) Autotest del verificador de invariantes.
      #    Garantiza que el propio script no se ha degradado antes de confiar
      #    en su veredicto sobre el proyecto.
      - name: Autotest de invariantes
        run: node tools/verify-invariants.js --selftest

      # 5) Validar la estructura interna del corpus (20 cursos).
      #    --root . recorre courses/segment-* y cruza con data/ si está.
      #    El exit code del script (0 ok · 1 crítico · 2 invocación) decide
      #    el resultado del job automáticamente; no hace falta parsear salida.
      - name: Validar el corpus
        run: node tools/validar-corpus.js --root .

      # 6) Verificar las invariantes globales del proyecto.
      #    Complementa al validador de corpus: principios de arquitectura,
      #    enlaces locales, contrato de datos, rutas y enlaces externos.
      - name: Verificar invariantes globales
        run: node tools/verify-invariants.js --root .
