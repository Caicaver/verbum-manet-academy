name: Auditoría editorial

# Ejecuta la auditoría del style guide en cada push y pull request.
# Corresponde a la mejora OPS-001 del roadmap (MEJORAS-ADICIONALES.md §7).
#
# NOTA: este workflow asume que la herramienta vma_audit está disponible.
# Como la herramienta vive fuera del repositorio del sitio (en audit-tool/,
# que está en .gitignore), este workflow la clona desde su propio repo o
# la descomprime desde un release. Ajusta la sección "Preparar auditor"
# según donde decidas alojar vma_audit.

on:
  push:
    branches: [main]
    paths:
      - 'courses/**'
      - 'pages/**'
      - 'data/**'
  pull_request:
    branches: [main]
    paths:
      - 'courses/**'
      - 'pages/**'
      - 'data/**'

jobs:
  audit:
    name: Auditar corpus contra style guide
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del sitio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

